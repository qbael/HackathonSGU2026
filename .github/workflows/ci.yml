name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: TypeScript typecheck
        run: npm run typecheck --prefix apps/web

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET solution
        run: dotnet build Findie.sln --no-incremental

  unit-and-smoke-tests:
    name: Unit & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Run Web unit tests
        run: npm test --prefix apps/web

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI service unit tests
        run: uv run --project services/ai --locked pytest services/ai/tests

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API for smoke tests
        run: dotnet build apps/api/Findie.Api.csproj

      - name: Run root Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Run API Kestrel smoke tests
        run: python3 apps/api/tests/smoke.py

  backend-integration:
    name: Backend Docker Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build API for integration tests
        run: dotnet build apps/api/Findie.Api.csproj

      - name: Run Docker integration checks
        run: python3 apps/api/tests/integration.py

  web-e2e-playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-and-smoke-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright browsers with deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Install Playwright system dependencies if cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web

      - name: Run Playwright E2E tests
        run: npm run test:e2e --prefix apps/web
        env:
          CI: true

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
